# Plain ServiceAccount, no IRSA annotation: the api and mlflow pods reach S3
# through the node group's instance role (terraform/eks.tf,
# terraform/iam.tf::aws_iam_policy.node_s3_access). Annotating it with
# `eks.amazonaws.com/role-arn` and a dedicated role (IRSA) is the upgrade when
# each service should get only the AWS permissions it uses.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-sa
  namespace: mlops-env
