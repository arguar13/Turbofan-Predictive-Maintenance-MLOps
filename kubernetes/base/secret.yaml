# Native Kubernetes Secret with the RDS/MLflow credentials and the /predict API
# key: simple to operate and debug. EKS encrypts Secrets at rest in etcd, but
# there is no automatic rotation and no audit trail of who read the value; a
# dedicated secret manager is the obvious upgrade if those become requirements.
#
# TEMPLATE: this file is NOT in kustomization.yaml, so `kubectl apply -k` never
# applies it or overwrites the real Secret. It documents the keys the pods
# expect (envFrom: secretRef: mlops-secrets). The real Secret is created once
# per cluster, outside git (README.md, "Deploying to AWS"):
#
#   kubectl create secret generic mlops-secrets -n mlops-env \
#     --from-literal=POSTGRES_USER="$(terraform -chdir=terraform output -raw db_username)" \
#     --from-literal=POSTGRES_PASSWORD="$(terraform -chdir=terraform output -raw db_password)" \
#     --from-literal=POSTGRES_DB=mlflow_db \
#     --from-literal=API_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NEVER commit the real values.
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: mlops-env
type: Opaque
stringData:
  POSTGRES_USER: "changeme"
  POSTGRES_PASSWORD: "changeme"
  POSTGRES_DB: "mlflow_db"
  API_KEY: "changeme"
