[tool.poetry]
name = "predictive-maintenance-api"
version = "2.0.0"
description = "Serving and inference microservice"
authors = ["Armando Guarnera"]
# The API is an APPLICATION served by uvicorn, not a library: there is no
# importable "predictive_maintenance_api" package and no wheel. Without this,
# `poetry install` tries to install the root project and fails with "No
# file/folder found for package", both in `make install` and in the Dockerfile.
# Poetry is used ONLY as a deterministic dependency manager.
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
# fastapi ^0.135.0 so that starlette resolves to >=1.3.1. Older floors kept
# starlette on versions with HIGH CVEs: CVE-2024-47874 (multipart DoS) and
# CVE-2026-48818 / CVE-2026-54283 (SSRF via UNC paths in StaticFiles,
# request.form() limits ignored).
fastapi = "^0.135.0"
uvicorn = "^0.41.0"
mlflow = "^3.15.1"
# torch MUST stay aligned with core_ml/pyproject.toml: the model is logged with
# serialization_format="pickle" (core_ml/src/train.py), and a pickled nn.Module
# is only guaranteed to load on the torch that produced it. (>= 2.6 also fixes
# CVE-2025-32434, RCE in torch.load.)
# CPU-only wheel (the "pytorch-cpu" source below): the API only runs inference.
# The default PyPI wheel adds ~2 GB of unused nvidia-* packages, enough to push
# the build_push job past its one-hour timeout.
torch = { version = "^2.13.0", source = "pytorch-cpu" }
# Same numpy major as core_ml: the two exchange arrays and a pickled
# scikit-learn scaler.
numpy = ">=2.0.0"
# Imported directly by api/main.py (a DataFrame with the scaler's
# feature_names_in_), so it is declared rather than left to mlflow.
pandas = ">=2.2.2"
pydantic = "^2.9.0"
joblib = "^1.4.2"
pyyaml = "^6.0.1"
# The scaler logged by core_ml/src/train.py is a scikit-learn StandardScaler that
# joblib.load unpickles here; without it load_champion fails with
# ModuleNotFoundError.
scikit-learn = ">=1.4.0"
structlog = "^26.1.0" # structured JSON logging (CloudWatch/Elasticsearch)
# mlflow.pytorch.load_model downloads from an s3:// artifact root through
# boto3/botocore. Local runs never need it (docker-compose's MLflow stores
# artifacts on disk), but against the EKS MLflow the API would fail with
# ModuleNotFoundError: 'botocore' and stay at 503.
boto3 = ">=1.38.27"

# ---------------------------------------------------------------------------
# Floors for TRANSITIVE dependencies with known CVEs
#
# None of these is imported directly; they come through mlflow. Declaring them
# is Poetry's only way to put a floor under a transitive package; otherwise the
# resolver may keep an older, vulnerable version mlflow still accepts. A real
# production setup would add a dependency scanner (e.g. Trivy) that fails the
# build in cases like these.
# ---------------------------------------------------------------------------
gunicorn = ">=22.0.0"       # CVE-2024-1135, CVE-2024-6827 (HTTP request smuggling)
protobuf = ">=5.29.6"        # CVE-2026-0994

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.4"
mypy = "^1.13.0"
types-pyyaml = "^6.0.12"
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
httpx = "^0.27.2"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Shift-left tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM"]
ignore = []

[tool.ruff.format]
# ruff format replaces black + isort: same style, one tool.

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
