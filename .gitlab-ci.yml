stages:
  - lint_test
  - build_push
  - deploy
  - train

variables:
  AWS_REGION: us-east-1
  # AWS_ACCOUNT_ID is a protected, masked project CI/CD variable (Settings >
  # CI/CD > Variables): the account ID is not versioned in a public repo.
  AWS_ROLE_ARN: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/GitLabCIRole"
  EKS_CLUSTER_NAME: predictive-maintenance-mlops
  # Same Poetry that generated both poetry.lock files (see their headers), so
  # local runs, CI and Docker resolve exactly the same environment.
  POETRY_VERSION: "2.4.1"

default:
  image: python:3.12-slim
  # Any runner that can run Docker jobs (gitlab.com shared or self-hosted).
  # Set a tag here if your runners require one.
  tags: []
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com

# AWS authentication through OIDC, with no long-lived static credentials: the
# job's id_token is exchanged for temporary credentials of GitLabCIRole (see
# terraform/iam.tf).
.aws_auth: &aws_auth
  before_script:
    - >
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update && apt-get install -y --no-install-recommends awscli jq curl
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache aws-cli jq curl
      fi
    - >
      aws sts assume-role-with-web-identity
      --role-arn $AWS_ROLE_ARN
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$AWS_OIDC_TOKEN" > /tmp/assume-role.json
    - export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/assume-role.json)
    - export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/assume-role.json)
    - export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/assume-role.json)

# Only the default branch pushes images and deploys: otherwise any feature-branch
# push would publish to ECR and apply unreviewed code to EKS, at real AWS cost.
.default_branch_only: &default_branch_only
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# 1. lint_test: format + ruff + pytest in api/ and core_ml/ (= `make ci`)
# ---------------------------------------------------------------------------
lint_test:
  stage: lint_test
  script:
    - apt-get update && apt-get install -y --no-install-recommends make git
    - pip install "poetry==${POETRY_VERSION}"
    - make install
    - make ci

# ---------------------------------------------------------------------------
# 2. build_push: build the API image and push it to ECR
# ---------------------------------------------------------------------------
build_push:
  stage: build_push
  needs: ["lint_test"]
  <<: [*default_branch_only, *aws_auth]
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - apk add --no-cache make
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    - make docker-build IMAGE_TAG=$CI_COMMIT_SHA
    - make docker-push IMAGE_TAG=$CI_COMMIT_SHA

# ---------------------------------------------------------------------------
# 3. deploy: apply the Kustomize overlay straight to the cluster
# ---------------------------------------------------------------------------
# Push-based: the job pins the image just published and runs `kubectl apply -k`
# itself. Simpler to follow than a pull-based GitOps controller, at the cost of
# CI holding temporary cluster credentials (terraform/iam.tf,
# aws_eks_access_entry.gitlab_ci).
deploy:
  stage: deploy
  needs: ["build_push"]
  image: alpine:3.20
  # Manual: publishing an image does not mean changing what the cluster serves.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  <<: *aws_auth
  script:
    - apk add --no-cache make curl bash
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
    - curl -sL "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
    - chmod +x /usr/local/bin/kubectl
    - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
    - make deploy IMAGE_TAG=$CI_COMMIT_SHA

# ---------------------------------------------------------------------------
# 4. train (manual): pull the full dataset, train, and promote to "champion" in
#    MLflow if the quality gate passes (see core_ml/src/train.py)
# ---------------------------------------------------------------------------
train:
  stage: train
  when: manual
  needs: []
  <<: *aws_auth
  # MLFLOW_TRACKING_URI comes from a project CI/CD variable pointing at the shared
  # MLflow the API reads, and must be reachable from the runner. Without it the
  # job falls back to a throwaway SQLite store, so nothing reaches the real
  # Model Registry.
  script:
    - pip install "poetry==${POETRY_VERSION}"
    - export MLFLOW_TRACKING_URI="${MLFLOW_TRACKING_URI:-sqlite:////tmp/mlflow.db}"
    - >
      if [ "$MLFLOW_TRACKING_URI" = "sqlite:////tmp/mlflow.db" ]; then
        echo "WARNING: MLFLOW_TRACKING_URI is not set; using a throwaway SQLite tracking store. This model will NOT be available to the API.";
      fi
    - cd core_ml
    - poetry install
    # The versioned remote holds a placeholder instead of the account ID.
    - poetry run dvc remote modify --local s3remote url "s3://predictive-maintenance-mlops-artifacts-${AWS_ACCOUNT_ID}"
    - poetry run dvc pull
    - poetry run python src/prepare_training_data.py --data-dir data
    - poetry run python src/train.py --data-dir data --epochs 25 --patience 5
